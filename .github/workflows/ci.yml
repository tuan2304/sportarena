name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Giá trị giả chỉ để build; các trang đều render lúc có request nên không gọi Supabase khi build
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    name: Web (Playwright e2e + CSP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run e2e:install
      # Playwright tự build rồi chạy bản production với Supabase giả (web/e2e/mock-supabase.mjs), không cần database thật
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  e2e-real:
    name: Web (Playwright write flows, real Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Ghim phiên bản CLI để CI không đổi hành vi khi Supabase phát hành bản mới; muốn nâng thì sửa số này (và thử `supabase start` cục bộ)
      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.2
      # Supabase cục bộ trong Docker: áp toàn bộ migration, có Auth, REST và Storage thật (bỏ các dịch vụ không cần để khởi động nhanh)
      # (mailpit/inbucket được giữ lại: ca quên mật khẩu cần dịch vụ gửi thư để GoTrue không báo lỗi)
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor
      - run: npm ci
        working-directory: web
      - run: npm run e2e:install
        working-directory: web
      - run: npm run e2e:real
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-real
          path: web/playwright-report
          retention-days: 7

  database:
    name: Database (migrations + RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Áp migration lên Postgres tạm và chạy kiểm thử bảo mật
        run: bash supabase/tests/run.sh

  mobile:
    name: Mobile (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
